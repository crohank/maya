server:
  host: 0.0.0.0
  port: 8443
  ssl_keyfile: certs/key.pem
  ssl_certfile: certs/cert.pem
  # Served at GET /ca.crt so a phone can install the local CA (docs/phone_setup.md).
  ca_certfile: certs/ca.crt

engine:
  # Passed as maya.engine.Engine(**opts); values are strings, like --opt key=value
  # in scripts/eval_pack.py. Empty means the defaults in maya/*.py.
  opts: {}
  # Load Qwen3-VL at startup so the first request does not pay the load.
  preload: true

whisper:
  # Spoken questions only (question_audio). Audio items use maya/audio.py's own model.
  size: small
  device: cpu
  compute_type: int8
  cpu_threads: 4
  language: en

tts:
  repo: rhasspy/piper-voices
  voice: en/en_US/lessac/medium/en_US-lessac-medium.onnx

video:
  # Live clip from "Ask about what is in front of me" (file + question_audio):
  # only the last window_s seconds are sent, since the question is about now.
  # An uploaded video is sent whole.
  window_s: 2.0
  fps: 4
  long_side: 448
  # Uploaded videos that are not already H.264 MP4 are re-encoded to this long side.
  mp4_long_side: 960

image:
  # Phone photos are 4000 px; maya/image.py caps at 1280 itself, this caps the
  # EXIF-rotated copy the app writes first.
  long_side: 1920

guards:
  # A header-only recording (seen: 5 bytes from iPhone Safari) cannot be decoded.
  min_media_bytes: 2000

timeouts:
  ffmpeg_s: 30
  request_s: 120
  # Code makes up to 3 generations of up to 768 tokens plus sandbox runs.
  code_request_s: 240

logs:
  routing: results/app_routing.jsonl
